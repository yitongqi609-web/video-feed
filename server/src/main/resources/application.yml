server:
  port: 8080

spring:
  application:
    name: video-feed-server
  datasource:
    # 宿主机映射端口见根目录 docker-compose.yml（3306/6379 被本机其他服务占用）
    url: jdbc:mysql://localhost:3320/video_feed?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: localhost
      port: 6390
      timeout: 3s

rocketmq:
  name-server: 127.0.0.1:9881
  producer:
    group: video-feed-producer
    send-message-timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input   # 雪花ID由应用侧 SnowflakeIdGenerator 生成后显式写入

logging:
  level:
    com.videofeed.mapper: debug

app:
  auth:
    # HS256 要求 >= 32 字节
    secret: video-feed-jwt-secret-please-change-in-prod-0123456789
    # Access 故意设短（5 分钟），便于演示过期后前端用 Refresh 静默续期
    access-ttl-seconds: 300
    refresh-ttl-seconds: 604800   # 7 天
  snowflake:
    worker-id: 1
  cache:
    video-ttl-seconds: 1800       # 基础 TTL 30 分钟
    random-ttl-seconds: 600       # 叠加 0~10 分钟随机 TTL，防雪崩
    null-ttl-seconds: 120         # 空值缓存 2 分钟，防穿透
  hot:
    like-weight: 3
    comment-weight: 5
    view-weight: 1
    top-n: 200
  mq:
    topic: video-event
